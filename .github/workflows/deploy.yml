name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax überprüfen
        run: |
          node --check main.js
          node --check i18n.js
          node --check site-config.js
          node --check scripts/build.mjs
          node scripts/check-i18n.mjs
          node scripts/check-faq.mjs
          node scripts/check-testimonials.mjs
          node scripts/check-layout.mjs
      - name: Website und Galerie erstellen
        run: node scripts/build.mjs
      - name: SEO und Sprachversionen prüfen
        run: node scripts/check-seo.mjs
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
